services:
  aircat-server-lite:
    image: upcyan/aircat-server-lite:latest
    container_name: aircat-server-lite
    ports:
      - "9000:9000"
    environment:
      - TZ=Asia/Shanghai
      # 控制台日志级别: DEBUG/INFO/WARNING/ERROR, 默认 DEBUG
      - LOG_LEVEL=DEBUG
      # 是否写入日志文件: true/false, 默认 false
      - LOG_FILE=false
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
