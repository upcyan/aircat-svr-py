services:
  aircat-server-sqlite:
    image: upcyan/aircat-server-sqlite:latest
    container_name: aircat-server-sqlite
    ports:
      - "9000:9000"
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      # 控制台日志级别: DEBUG/INFO/WARNING/ERROR, 默认 DEBUG
      - LOG_LEVEL=DEBUG
      # 是否写入日志文件: true/false, 默认 false
      - LOG_FILE=false
      # SQLite 数据库路径, 默认 /data/aircat.db
      - DB_PATH=/data/aircat.db
      # Web 界面端口, 默认 8080
      - WEB_PORT=8080
      # 可选: 首次启动设置用户名（留空则不启用认证）
      # - AUTH_USER=admin
      # 可选: 首次启动设置密码（设置后自动启用认证）
      # - AUTH_PASS=yourpassword
      # 可选: 首次启动设置 M1 亮度（-1=不控制, 0=息屏, 25/50/75/100=亮度）
      # - M1_BRIGHTNESS=-1
      # 可选: 首次启动启用定时开关屏
      # - M1_TIMER_ENABLED=false
    volumes:
      - ./data:/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
