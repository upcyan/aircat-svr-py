name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Keep moving tags from being overwritten by an older concurrent release.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Generate image metadata
        id: image_meta
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push lite image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./lite.Dockerfile
          push: true
          # Disabling attestations alone does not force Docker manifest media types.
          outputs: type=image,oci-mediatypes=false,compression=gzip,force-compression=true
          pull: true
          provenance: false
          sbom: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.current_version }}
          labels: |
            org.opencontainers.image.title=aircat-server-lite
            org.opencontainers.image.description=Phicomm M1 air quality monitor server (lite version)
            org.opencontainers.image.version=${{ steps.version.outputs.current_version }}
            org.opencontainers.image.created=${{ steps.image_meta.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aircat-server-lite:latest
            ${{ secrets.DOCKER_USERNAME }}/aircat-server-lite:${{ steps.version.outputs.current_version }}
            ${{ secrets.DOCKER_USERNAME }}/aircat-server-lite:sha-${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web.Dockerfile
          push: true
          outputs: type=image,oci-mediatypes=false,compression=gzip,force-compression=true
          pull: true
          provenance: false
          sbom: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.current_version }}
          labels: |
            org.opencontainers.image.title=aircat-server-web
            org.opencontainers.image.description=Phicomm M1 air quality monitor server (full version with web UI)
            org.opencontainers.image.version=${{ steps.version.outputs.current_version }}
            org.opencontainers.image.created=${{ steps.image_meta.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aircat-server-web:latest
            ${{ secrets.DOCKER_USERNAME }}/aircat-server-web:${{ steps.version.outputs.current_version }}
            ${{ secrets.DOCKER_USERNAME }}/aircat-server-web:sha-${{ github.sha }}

      - name: Verify published Docker manifest compatibility
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for variant in lite web; do
            image="$DOCKER_USERNAME/aircat-server-$variant"
            # Inspect the immutable build tag so another run cannot change the target.
            manifest=$(docker buildx imagetools inspect "$image:sha-$IMAGE_REVISION" --raw)
            echo "$manifest" | jq -e '
              .schemaVersion == 2 and
              .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json" and
              (.manifests | length == 2) and
              ([.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]) and
              all(.manifests[]; .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
            '
            for digest in $(echo "$manifest" | jq -r '.manifests[].digest'); do
              docker buildx imagetools inspect "$image@$digest" --raw | jq -e '
                .schemaVersion == 2 and
                .mediaType == "application/vnd.docker.distribution.manifest.v2+json" and
                .config.mediaType == "application/vnd.docker.container.image.v1+json" and
                all(.layers[]; .mediaType == "application/vnd.docker.image.rootfs.diff.tar.gzip")
              '
            done
          done

      - name: Publish and verify single-platform compatibility tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_REVISION: ${{ github.sha }}
          IMAGE_VERSION: ${{ steps.version.outputs.current_version }}
        run: python3 scripts/publish_platform_tags.py

      - name: Increment version
        run: |
          VERSION=$(cat VERSION)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "$NEW_VERSION" > VERSION
          echo "New version: $NEW_VERSION"

      - name: Commit version bump
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add VERSION
          git commit -m "chore: bump version to $(cat VERSION) [skip ci]"
          git push origin HEAD:main
